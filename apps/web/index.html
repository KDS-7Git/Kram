<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="A private planner for your goals, your time and what happens next."
    />
    <meta name="theme-color" content="#F6F5F2" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/kram-192.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <script id="theme-init">
      try {
        const a = JSON.parse(localStorage.getItem("kram-appearance") || "{}");
        let d =
          a.theme === "dark" ||
          ((!a.theme || a.theme === "system") &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        if (a.theme === "scheduled") {
          const h = new Date().getHours() * 60 + new Date().getMinutes();
          const w = a.wakeMin ?? 420;
          const s = ((a.sleepMin ?? 1380) - 60 + 1440) % 1440;
          d = s > w ? h >= s || h < w : h >= s && h < w;
        }
        document.documentElement.dataset.theme = d ? "dark" : "light";
        document.documentElement.dataset.motion = a.motion ?? "system";
        document.documentElement.dataset.density = a.density ?? "comfortable";
        document.documentElement.style.colorScheme = d ? "dark" : "light";
        document.querySelector('meta[name="theme-color"]').content = d
          ? "#0D0E11"
          : "#F6F5F2";
      } catch {}
    </script>
    <title>Kram</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
