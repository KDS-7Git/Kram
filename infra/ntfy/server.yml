# No external ntfy services are contacted by this configuration.
listen-http: ":80"
cache-file: "/var/cache/ntfy/cache.db"
auth-file: "/var/lib/ntfy/user.db"
auth-default-access: "deny-all"
enable-login: true
behind-proxy: true
# Kram sends text reminders. Attachment storage requires a reachable base-url.
cache-duration: "24h"
